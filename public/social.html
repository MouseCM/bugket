<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SpeakUp — Trò chuyện & Kết bạn</title>
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="stylesheet" href="/styles.css?v=6" />
    <!-- Load Socket.IO client -->
    <script src="/socket.io/socket.io.js"></script>
  </head>
  <body>
    <!-- Navbar -->
    <nav class="nav fade-in">
      <div class="container nav-inner">
        <a class="brand" href="/">
          <img src="/logo.png" alt="SpeakUp" class="brand-logo" />
          <span>SpeakUp</span>
        </a>
        <div class="menu" id="nav-menu">
          <!-- Populated by auth.js -->
        </div>
      </div>
    </nav>

    <!-- Main Chat Layout -->
    <main class="container fade-in" style="animation-delay: 0.1s;">
      <div class="social-container">
        
        <!-- Sidebar (Friends / Requests / Search) -->
        <aside class="social-sidebar">
          <div class="sidebar-header">
            <div class="sidebar-tabs">
              <div class="sidebar-tab active" id="tab-friends">Bạn bè</div>
              <div class="sidebar-tab" id="tab-requests">Lời mời</div>
              <div class="sidebar-tab" id="tab-search">Tìm kiếm</div>
            </div>
            <div class="search-bar" id="search-container" style="display: none;">
              <input type="text" id="search-input" placeholder="Nhập tên hoặc email..." />
            </div>
          </div>

          <div class="sidebar-content" id="sidebar-content">
            <!-- Dynamic content injected here via JS -->
            <div class="empty-state">
              <svg viewBox="0 0 24 24" fill="none"><path d="M12 20a8 8 0 1 0 0-16 8 8 0 0 0 0 16Z" stroke="currentColor" stroke-width="2"/><path d="M12 14a2 2 0 1 0 0-4 2 2 0 0 0 0 4Z" fill="currentColor"/></svg>
              <div>Đang tải dữ liệu...</div>
            </div>
          </div>
        </aside>

        <!-- Main Chat Area -->
        <section class="social-chat-area">
          <div id="chat-empty-state" class="empty-state">
            <svg viewBox="0 0 24 24" fill="none"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <div>Chọn một người bạn để bắt đầu trò chuyện</div>
          </div>

          <!-- Chat UI (hidden by default) -->
          <div id="chat-active-ui" style="display: none; flex-direction: column; height: 100%;">
            <div class="chat-header">
              <div class="user-avatar" id="chat-avatar"></div>
              <div class="user-info">
                <div class="user-name" id="chat-name">Tên bạn bè</div>
                <div class="user-msg-preview" id="chat-status">Đang tải...</div>
              </div>
            </div>

            <div class="chat-messages" id="chat-messages">
              <!-- Messages injected here -->
            </div>

            <div class="typing-indicator" id="typing-indicator" style="display: none;">
              <span id="typing-name">Bạn bè</span> đang nhắn tin
              <div class="typing-dots">
                <span></span><span></span><span></span>
              </div>
            </div>

            <form class="chat-input-area" id="chat-form">
              <input type="text" id="chat-input" placeholder="Nhập tin nhắn..." autocomplete="off" />
              <button type="submit" class="send-btn">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </button>
            </form>
          </div>
        </section>

      </div>
    </main>

    <script src="/js/auth.js"></script>
    <script src="/js/social.js"></script>
    <script src="/js/animations.js"></script>
  </body>
</html>
