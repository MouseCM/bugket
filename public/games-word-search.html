<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>bugket - Game tìm từ</title>
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <nav class="nav">
      <div class="container nav-inner">
        <a class="brand" href="/">
          <img class="brand-logo" src="/logo.png" alt="bugket logo" />
          <span>bugket</span>
        </a>
        <div class="menu">
          <a href="/" aria-label="Trang chủ" title="Trang chủ">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M4 10.5 12 4l8 6.5V20a1.5 1.5 0 0 1-1.5 1.5H5.5A1.5 1.5 0 0 1 4 20v-9.5Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
              <path d="M9.5 21v-6.2A1.8 1.8 0 0 1 11.3 13h1.4a1.8 1.8 0 0 1 1.8 1.8V21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
            <span class="nav-label">Trang chủ</span>
          </a>
          <a href="/learn.html" aria-label="Từ vựng" title="Từ vựng">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M6 4.5h9.5A2.5 2.5 0 0 1 18 7v13.5c-1-.7-2.2-1.1-3.5-1.1H6A2.5 2.5 0 0 1 3.5 17V7A2.5 2.5 0 0 1 6 4.5Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
              <path d="M6.5 8h8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              <path d="M6.5 11.5h6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
            <span class="nav-label">Từ vựng</span>
          </a>
          <a class="active" href="/games.html" aria-label="Trò chơi" title="Trò chơi">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M8 10.8h1.4v-1.4A2 2 0 0 1 11.4 7.4h1.2a2 2 0 0 1 2 2V10.8H16a4 4 0 0 1 4 4V16a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4v-1.2a4 4 0 0 1 4-4Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
              <path d="M9.2 14.6v3.2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              <path d="M7.6 16.2h3.2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              <path d="M15.6 15.6h.01" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
              <path d="M17.6 17.2h.01" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
            </svg>
            <span class="nav-label">Trò chơi</span>
          </a>
          <a href="/chat.html" aria-label="Trò chuyện AI" title="Trò chuyện AI">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M7 18.5 4 21V6.5A2.5 2.5 0 0 1 6.5 4h11A2.5 2.5 0 0 1 20 6.5v8A2.5 2.5 0 0 1 17.5 17H9.2L7 18.5Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
              <path d="M8 8.5h8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              <path d="M8 12h6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
            <span class="nav-label">Trò chuyện AI</span>
          </a>
        </div>
      </div>
    </nav>

    <main class="container section">
      <h1>Game: Tìm từ trong bảng chữ</h1>
      <p class="muted">Chọn các ô theo thứ tự, sau đó bấm Gửi để kiểm tra từ.</p>

      <section class="card">
        <div id="target-words" class="muted"></div>
        <p class="small">Điểm: <strong id="score-word-search">0</strong> | Lượt thử: <strong id="attempt-word-search">0</strong></p>
        <p class="small" id="level-row-word-search" style="display: none">Đánh giá: <strong id="level-word-search"></strong></p>
        <p class="small">Từ đang chọn: <strong id="current-selection">-</strong></p>
        <div id="puzzle-grid" class="puzzle-grid"></div>
        <div class="btn-row">
          <button class="btn btn-primary" id="submit-puzzle">Gửi từ đã chọn</button>
          <button class="btn btn-secondary" id="clear-puzzle">Xóa lựa chọn</button>
        </div>
        <p id="puzzle-result"></p>
      </section>
    </main>

    <script src="/js/games-word-search.js"></script>
  </body>
</html>
