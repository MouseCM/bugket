<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>bugket - Game sắp xếp từ</title>
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <nav class="nav">
      <div class="container nav-inner">
        <a class="brand" href="/">
          <img class="brand-logo" src="/logo.png" alt="bugket logo" />
          <span>bugket</span>
        </a>
        <div class="menu">
          <a href="/">Trang chủ</a>
          <a href="/learn.html">Từ vựng</a>
          <a class="active" href="/games.html">Trò chơi</a>
          <a href="/chat.html">Trò chuyện AI</a>
        </div>
      </div>
    </nav>

    <main class="container section">
      <h1>Game: Sắp xếp lại từ</h1>
      <p class="muted">Giải từ bị xáo trộn chữ cái.</p>

      <section class="card">
        <h2 id="scrambled"></h2>
        <p class="small">Điểm: <strong id="score-unscramble">0</strong> | Lượt thử: <strong id="attempt-unscramble">0</strong></p>
        <p class="small" id="level-row-unscramble" style="display: none">Đánh giá: <strong id="level-unscramble"></strong></p>
        <input id="guess-input" placeholder="Nhập đáp án..." />
        <div class="btn-row" style="margin-top: 10px">
          <button class="btn btn-primary" id="check-guess">Kiểm tra</button>
          <button class="btn btn-secondary" id="new-round">Từ mới</button>
        </div>
        <p id="guess-result"></p>
      </section>
    </main>

    <script src="/js/games-unscramble.js"></script>
  </body>
</html>
